<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print QR — Pack 425 Pinewood Derby 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #0a1628;
    }

    /* ── Single card centered on page ── */
    .page {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 36px;
      text-align: center;
    }

    /* ── Emblem ── */
    .card-emblem img {
      height: 72px;
      width: auto;
      object-fit: contain;
    }

    /* ── Title ── */
    .card-title {
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #0a1628;
      line-height: 1.1;
    }
    .card-title span { color: #c8102e; }

    /* ── QR box ── */
    .qr-wrap {
      width: 210px;
      height: 210px;
      background: #fff;
      border: 3px solid #0a1628;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
      flex-shrink: 0;
    }
    .qr-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── Pack label ── */
    .card-pack {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4a6090;
    }

    /* ── CTA ── */
    .card-cta {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0a1628;
    }

    /* ── URL highlight ── */
    .card-url {
      display: inline-block;
      background: #c8102e;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 5px 18px;
      border-radius: 6px;
    }

    /* ── Note ── */
    .card-note {
      font-size: 0.8rem;
      color: #7090b0;
    }

    /* ── Print styles ── */
    @media print {
      @page {
        size: letter landscape;
        margin: 0.4in;
      }

      .page { width: 100%; height: 100%; }
    }
  </style>
</head>
<body>

  <div class="page">

      <!-- Card 1 -->
      <div class="card">
        <div class="card-emblem">
          <img src="assets/cubscouts200.png" alt="Cub Scouts" />
        </div>
        <div class="card-title">Pinewood&nbsp;<span>Derby</span>&nbsp;2026</div>
        <div class="qr-wrap">
          <img id="qr-img-1" src="" alt="QR code" />
        </div>
        <div class="card-pack">Pack 425</div>
        <div class="card-cta">📱 Scan to see live results on your phone</div>
        <div class="card-url">bit.ly/pinewood-2026</div>
        <div class="card-note">Updates automatically — no app needed</div>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('qr-img-1').src =
      'https://api.qrserver.com/v1/create-qr-code/?data='
      + encodeURIComponent('https://bit.ly/pinewood-2026')
      + '&size=400x400&margin=10';
  </script>

</body>
</html>
